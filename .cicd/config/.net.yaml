project:
  name: dotnet-app
  projectType: backend
  language: csharp
  framework: aspnetcore

runtime:
  version: "8.0.x"

build:
  tool: dotnet
  packageManager: nuget

  installCommand: "dotnet restore"
  buildCommand: "dotnet build --configuration Release --no-restore"
  testCommand: "dotnet test --configuration Release --no-build"
  lintCommand: ""

  artifactPath: "bin/Release"
  coveragePath: "TestResults"

quality:
  sonarEnabled: true

security:
  securityScanEnabled: true
  filesystemScan: true
  dependencyScan: true
  containerScan: true

docker:
  enabled: true
  dockerfile: Dockerfile
  imageName: dotnet-app
  registry: ghcr

deployment:
  enabled: true
  type: container
  environment: dev
  target: vps

  container:
    port: 8080
    hostPort: 8080

artifactRepository:
  enabled: false
  type: nexus
  format: raw
  url: ""
  repository: ""