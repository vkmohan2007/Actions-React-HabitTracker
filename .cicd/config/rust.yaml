project:
  name: rust-app
  projectType: backend
  language: rust
  framework: cargo

runtime:
  version: "stable"

build:
  tool: cargo
  packageManager: cargo
  installCommand: ""
  buildCommand: "cargo build --release"
  testCommand: "cargo test"
  lintCommand: "cargo clippy -- -D warnings"
  artifactPath: "target/release/rust-app"
  coveragePath: ""

quality:
  sonarEnabled: true

security:
  securityScanEnabled: true
  filesystemScan: true
  dependencyScan: true
  containerScan: true

docker:
  enabled: true
  dockerfile: Dockerfile
  imageName: rust-app
  registry: ghcr

deployment:
  enabled: true
  type: container
  environment: dev
  target: vps

  container:
    port: 8080
    hostPort: 8080

artifactRepository:
  enabled: false
  type: nexus
  format: raw
  url: ""
  repository: ""
