# Supported artifactRepository.format values.
#
# .cicd/scripts/validate-config.sh checks artifactRepository.format against
# this file when artifactRepository.enabled is true. .cicd/scripts/nexus.sh
# implements "raw" end-to-end (plain HTTP PUT, works for any file type); the
# rest are documented extension points — see .cicd/README.md
# "Adding an artifact repository format".

raw:
  description: "Generic file upload via HTTP PUT to a Nexus 'raw' hosted repository. Works for any artifact type."
  implemented: true

maven2:
  description: "Java artifacts (jar/pom) published to a Nexus maven2-format repository."
  implemented: false

npm:
  description: "npm packages published to a Nexus npm-format repository."
  implemented: false

pypi:
  description: "Python wheels/sdists published to a Nexus pypi-format repository."
  implemented: false

nuget:
  description: ".NET packages published to a Nexus nuget-format repository."
  implemented: false

composer:
  description: "PHP packages published to a Nexus composer-format (Packagist-compatible) repository."
  implemented: false
