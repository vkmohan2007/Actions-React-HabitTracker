# Fallback values for any field a project's config.yml leaves unset.
#
# Loaded by .cicd/scripts/lib/common.sh (`merged_config`) and merged UNDER the
# project config, so a project's own value always wins here. Shape mirrors
# config.yml exactly (same top-level keys, same nesting) so the merge lines up.
#
# Fields with no universally-safe default — project.name, project.language,
# build.tool, runtime.version — are deliberately left out and are instead
# enforced as required by .cicd/scripts/validate-config.sh.

project:
  projectType: backend

build:
  packageManager: ""
  installCommand: ""
  buildCommand: ""
  testCommand: ""
  lintCommand: ""
  artifactPath: "dist"
  coveragePath: "coverage"

quality:
  sonarEnabled: false

security:
  securityScanEnabled: true
  filesystemScan: true
  dependencyScan: true
  containerScan: true

docker:
  enabled: false
  dockerfile: "Dockerfile"
  imageName: ""
  registry: "ghcr"

deployment:
  enabled: false
  type: "container"
  environment: "dev"
  target: "vps"
  container:
    port: 8080
    hostPort: 8080
    restartPolicy: "unless-stopped"

artifactRepository:
  enabled: false
  type: "nexus"
  format: "raw"
  url: ""
  repository: ""
  groupPath: ""
  version: ""
