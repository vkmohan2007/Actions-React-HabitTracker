# Supported deployment.type / deployment.target combinations.
#
# .cicd/scripts/validate-config.sh checks a project's deployment.type and
# deployment.target against this file and fails fast with a clear error if
# either is unrecognized. .cicd/scripts/deploy.sh currently *implements*
# only container/vps end-to-end (matching this repo's own deployment) — the
# rest are documented here as the contract to fill in when that target is
# actually needed. See .cicd/README.md "Adding a deployment target".

container:
  description: "Build a Docker image and run it on a target host."
  requiresDocker: true
  targets:
    vps:
      description: "SSH into a VPS/VM and `docker run` the image directly."
      requiredSecrets: [VPS_HOST, VPS_USER, VPS_SSH_KEY]
      implemented: true
    ec2:
      description: "Same mechanism as vps (SSH + docker run) against an EC2 instance."
      requiredSecrets: [VPS_HOST, VPS_USER, VPS_SSH_KEY]
      implemented: false
    kubernetes:
      description: "Apply a manifest/Helm chart referencing the built image."
      requiredSecrets: [KUBE_CONFIG]
      implemented: false
    eks:
      description: "Deploy to an EKS cluster via kubectl/helm with OIDC auth."
      requiredSecrets: [AWS_ROLE_ARN]
      implemented: false

static:
  description: "Publish static build output directly, no Docker image involved."
  requiresDocker: false
  targets:
    s3:
      description: "Sync build.artifactPath to an S3 bucket, optionally invalidate CloudFront."
      requiredSecrets: [AWS_ROLE_ARN, S3_BUCKET]
      implemented: false
    pages:
      description: "Publish build.artifactPath to GitHub Pages."
      requiredSecrets: []
      implemented: false

# Publishing a build artifact (jar / nupkg / wheel / raw file) to a repository
# manager is NOT modeled as a deployment.type here. It's independent of
# deployment (it can run on every build, not just deploys) and has its own
# top-level config block instead: artifactRepository.enabled, validated
# against mappings/artifact-repository-formats.yml and implemented by the
# workflow's "nexus" job / scripts/nexus.sh. See .cicd/README.md
# "Publishing to an artifact repository".
package:
  description: "Publish a build artifact to a repository manager other than Nexus (e.g. Artifactory)."
  requiresDocker: false
  targets:
    artifactory:
      requiredSecrets: [ARTIFACTORY_URL, ARTIFACTORY_TOKEN]
      implemented: false
