name: React CI/CD

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: my-react-app

jobs:

  # ============================================================
  # 1. INSTALL + LINT + TEST
  # ============================================================
  test:
    name: Test React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/component tests
        run: npm run test:ci

      - name: Build React application
        run: npm run build

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/



  # ============================================================
  # 2. SONARQUBE CODE QUALITY
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Check SonarQube connectivity
        run: |
          echo "Checking SonarQube: ${{ secrets.SONAR_HOST_URL }}"

          curl --fail --silent --show-error \
            "${{ secrets.SONAR_HOST_URL }}/api/system/status"

          echo "SonarQube is reachable and operational"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 3. TRIVY FILESYSTEM / DEPENDENCY SCAN
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


  # ============================================================
  # 4. BUILD DOCKER IMAGE
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - sonarqube
      - trivy-fs

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build Docker image for Trivy
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .


  # ============================================================
  # 5. TRIVY DOCKER IMAGE SCAN
  # ============================================================
  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Save Docker image
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o docker-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 1


  # ============================================================
  # 6. PUSH DOCKER IMAGE TO NEXUS REPOSITORY
  # ============================================================
  nexus-docker-push:
    name: Push Docker Image to Nexus
    runs-on: ubuntu-latest
    needs: trivy-image

    if: github.event_name != 'pull_request'

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: |
          docker load -i docker-image.tar

      - name: Verify Docker image
        run: |
          docker image inspect             ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Test Nexus Registry Connectivity
        run: |
          echo "Testing Nexus Docker Registry..."

          curl --fail --silent --show-error             --connect-timeout 10             --max-time 30             "https://${{ secrets.NEXUS_REGISTRY }}/v2/"             || true

      - name: Login to Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Tag Docker image
        run: |
          docker tag             ${{ env.IMAGE_NAME }}:${{ github.sha }}             ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.NEXUS_DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker tag             ${{ env.IMAGE_NAME }}:${{ github.sha }}             ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.NEXUS_DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push SHA image to Nexus
        run: |
          docker push             ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.NEXUS_DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push latest image to Nexus
        run: |
          docker push             ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.NEXUS_DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # 7. DEPLOY TO VPS
  # ============================================================
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: nexus-docker-push

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            set -e

            REGISTRY="${{ secrets.NEXUS_REGISTRY }}"
            REPOSITORY="${{ secrets.NEXUS_DOCKER_REPOSITORY }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            IMAGE="${REGISTRY}/${REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}"

            echo "Connected to VPS"
            whoami
            hostname

            echo "Logging into Nexus..."
            echo "${{ secrets.NEXUS_PASSWORD }}" |               docker login "$REGISTRY"               -u "${{ secrets.NEXUS_USERNAME }}"               --password-stdin

            echo "Pulling image from Nexus..."
            docker pull "$IMAGE"

            echo "Removing old container..."
            docker stop "$IMAGE_NAME" || true
            docker rm "$IMAGE_NAME" || true

            echo "Starting new container..."
            docker run -d               --name "$IMAGE_NAME"               --restart unless-stopped               -p 9999:80               "$IMAGE"

            echo "Testing application..."
            sleep 5
            curl --fail               --connect-timeout 10               --max-time 30               http://localhost:9999

            echo "Deployment completed successfully"
