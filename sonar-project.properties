# SonarQube project identification
sonar.projectKey=vkmohan2007_react
sonar.projectName=react

# Source and test locations (tests are co-located with source under src/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.spec.js,src/**/*.spec.jsx

# Files never analyzed
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.js

# Files excluded from coverage metrics (entry point, test setup, not meaningfully testable)
sonar.coverage.exclusions=src/main.jsx,src/test/**,**/*.test.jsx,**/*.test.js

# Coverage report produced by `npm run test:ci` (vitest --coverage, lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
